<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>管理者の追加・解除｜ワンニャンSOS熊本</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 54px 0 40px 0;
      background-color: #dbe2e8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app-top-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 46px;
      background: #c53030; color: #ffffff; border-bottom: 2px solid #9b2c2c;
      display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
      z-index: 1000; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .top-btn {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      color: #ffffff; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold;
      text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 4px;
    }
    .top-title { font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }

    .container { max-width: 480px; margin: 0 auto; padding: 12px; }

    .search-box {
      width: 100%; padding: 10px; border: 2px solid #cbd5e0; border-radius: 8px;
      font-size: 14px; margin-bottom: 16px; box-sizing: border-box;
    }

    .warning-box {
      background: #fff5f5; border: 1px dashed #feb2b2; border-radius: 8px; padding: 10px;
      font-size: 11px; color: #c53030; line-height: 1.5; margin-bottom: 16px;
    }

    .user-card {
      background: #ffffff; border: 2px solid #cbd5e0; border-radius: 10px; padding: 12px;
      margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .user-card.is-admin { border-color: #d69e2e; background: #fffaf0; }
    .user-name { font-weight: bold; font-size: 14px; color: #2d3748; }
    .user-phone { font-size: 11px; color: #718096; }
    .admin-tag {
      display: inline-block; background: #d69e2e; color: #fff; font-size: 9px;
      padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 6px;
    }
    .toggle-btn {
      padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: bold;
      border: none; cursor: pointer; white-space: nowrap;
    }
    .toggle-btn.grant { background: #00873c; color: #fff; }
    .toggle-btn.revoke { background: #718096; color: #fff; }

    .loading-box, .empty-box {
      background: #fff; border: 1px solid #cbd5e0; border-radius: 8px; padding: 20px; text-align: center; color: #718096; font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="app-top-bar">
    <button type="button" class="top-btn" onclick="window.location.href='admin.html'">← 管理コンソール</button>
    <div class="top-title">👥 管理者の追加・解除</div>
    <div style="width: 90px;"></div>
  </div>

  <div class="container">
    <div class="warning-box">
      ⚠️ ここで「管理者にする」を押した相手は、この管理コンソール全体を操作できるようになります。信頼できる相手だけに付与してください。
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="表示名または電話番号で検索..." oninput="renderList()">

    <div id="userList">
      <div class="loading-box">読み込み中...</div>
    </div>
  </div>

  <script>
    // 🔐 未ログインガード
    const savedPhone = localStorage.getItem('wanSOS_user_phone');
    if (!savedPhone) {
      window.location.href = '../index.html';
    }

    let allUsers = [];
    let currentUserId = '';

    document.addEventListener('DOMContentLoaded', async () => {
      if (!window.supabaseClient) {
        alert("データベース接続設定が見つかりません。");
        window.location.href = 'admin.html';
        return;
      }

      try {
        const { data: { session } } = await window.supabaseClient.auth.getSession();
        if (!session || !session.user) {
          window.location.href = '../index.html';
          return;
        }
        currentUserId = session.user.id;

        const { data: myProfile, error: myError } = await window.supabaseClient
          .from('users_profiles')
          .select('is_admin')
          .eq('auth_user_id', currentUserId)
          .single();

        if (myError || !myProfile || myProfile.is_admin !== true) {
          alert("管理者権限がありません。");
          window.location.href = 'home.html';
          return;
        }

        await loadUsers();
      } catch (e) {
        document.getElementById('userList').innerHTML = '<div class="empty-box">読み込みに失敗しました。</div>';
      }
    });

    async function loadUsers() {
      const { data, error } = await window.supabaseClient
        .from('users_profiles')
        .select('auth_user_id, nickname, full_name, phone, is_admin')
        .order('nickname', { ascending: true });

      if (error) {
        document.getElementById('userList').innerHTML = `<div class="empty-box">読み込みエラー：${error.message}</div>`;
        return;
      }

      allUsers = data || [];
      renderList();
    }

    function renderList() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const listEl = document.getElementById('userList');

      const filtered = allUsers.filter(u => {
        if (!keyword) return true;
        return (u.nickname || '').toLowerCase().includes(keyword)
          || (u.phone || '').includes(keyword)
          || (u.full_name || '').toLowerCase().includes(keyword);
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-box">該当するユーザーが見つかりません。</div>';
        return;
      }

      listEl.innerHTML = filtered.map(u => {
        const isAdmin = u.is_admin === true;
        const isSelf = u.auth_user_id === currentUserId;
        return `
          <div class="user-card ${isAdmin ? 'is-admin' : ''}">
            <div>
              <div class="user-name">${escapeHtml(u.nickname || '（未設定）')} ${isAdmin ? '<span class="admin-tag">ADMIN</span>' : ''}</div>
              <div class="user-phone">${escapeHtml(u.phone || '')} ${u.full_name ? '／ ' + escapeHtml(u.full_name) : ''}</div>
            </div>
            ${isSelf
              ? '<span style="font-size:10px; color:#a0aec0;">自分自身</span>'
              : `<button type="button" class="toggle-btn ${isAdmin ? 'revoke' : 'grant'}" onclick="toggleAdmin('${u.auth_user_id}', ${!isAdmin})">
                  ${isAdmin ? '解除する' : '管理者にする'}
                </button>`
            }
          </div>
        `;
      }).join('');
    }

    async function toggleAdmin(targetAuthUserId, newValue) {
      const label = newValue ? 'このユーザーを管理者にします。よろしいですか？' : 'このユーザーの管理者権限を解除します。よろしいですか？';
      if (!confirm(label)) return;

      const { error } = await window.supabaseClient
        .from('users_profiles')
        .update({ is_admin: newValue })
        .eq('auth_user_id', targetAuthUserId);

      if (error) {
        alert("更新に失敗しました：" + error.message);
        return;
      }

      await loadUsers();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }
  </script>

</body>
</html>
