        </div>


        <div class="resolved-result">

          <strong>
            対応結果
          </strong>

          <p>
            無事に2匹とも発見されました。
            ご協力ありがとうございました。
          </p>

        </div>


        <div class="sos-card-footer">

          <span class="sos-date">
            解決：2026/8/28
          </span>

          <a href="sos-detail.html">

  <!-- 下部ナビ -->
