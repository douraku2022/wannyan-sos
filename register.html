<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>新規ユーザー登録 - ワンニャンSOS熊本</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      padding-bottom: 40px;
    }
    .app-header {
      background-color: #ffffff;
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e0e0e0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-button {
      font-size: 20px;
      color: #333;
      text-decoration: none;
    }
    .header-logo {
      font-size: 16px;
      font-weight: bold;
      color: #2c3e50;
    }
    .container {
      max-width: 500px;
      margin: 20px auto;
      padding: 0 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #2c3e50;
      text-align: center;
    }
    .subtitle {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #444;
    }
    .required {
      color: #e74c3c;
      margin-left: 4px;
    }
    input[type="text"],
    input[type="tel"],
    input[type="date"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #fff;
    }
    input:focus {
      border-color: #3498db;
      outline: none;
    }
    .help-text {
      font-size: 11px;
      color: #777;
      margin-top: 4px;
    }
    .checkbox-group {
      margin: 20px 0;
      padding: 12px;
      background-color: #fdfbf7;
      border: 1px solid #f0e6d2;
      border-radius: 8px;
    }
    .checkbox-label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: normal;
    }
    .checkbox-label input {
      margin-top: 3px;
    }
    .btn-submit {
      width: 100%;
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background-color: #219653;
    }
    .error-message {
      color: #e74c3c;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <a href="javascript:history.back()" class="back-button" aria-label="戻る">←</a>
    <div class="header-logo">🐕🐈 ワンニャンSOS熊本</div>
    <div style="width: 24px;"></div>
  </header>

  <div class="container">
    <div class="card">
      <h1>新規ユーザー登録</h1>
      <p class="subtitle">安全な相互支援のため、本人確認情報をご入力ください</p>

      <div id="errorMessage" class="error-message"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">氏名（本名）<span class="required">*</span></label>
          <input type="text" id="fullName" placeholder="例：熊本 太郎" required>
          <p class="help-text">※緊急時・捜査協力時の本人確認用です。他ユーザーには公開されません。</p>
        </div>

        <div class="form-group">
          <label for="birthdate">生年月日<span class="required">*</span></label>
          <input type="date" id="birthdate" required>
          <p class="help-text">※本サービスは18歳以上の方のみご利用いただけます。</p>
        </div>

        <div class="form-group">
          <label for="address">住所<span class="required">*</span></label>
          <input type="text" id="address" placeholder="例：熊本市中央区手取本町1-1" required>
        </div>

        <div class="form-group">
          <label for="phone">電話番号<span class="required">*</span></label>
          <input type="tel" id="phone" placeholder="例：09012345678" required>
        </div>

        <div class="form-group">
          <label for="displayName">表示名（ニックネーム）<span class="required">*</span></label>
          <input type="text" id="displayName" placeholder="例：くまモンママ" required>
          <p class="help-text">※掲示板やマイページで他のユーザーに公開されるお名前です。</p>
        </div>

        <div class="form-group">
          <label for="password">パスワード<span class="required">*</span></label>
          <input type="password" id="password" placeholder="6文字以上で入力" minlength="6" required>
        </div>

        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="agreeTerms" required>
            <span>私は18歳以上であり、<a href="terms.html" target="_blank">利用規約</a>および<a href="privacy.html" target="_blank">プライバシーポリシー</a>の内容に同意します。</span>
          </label>
        </div>

        <button type="submit" class="btn-submit">登録する</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const birthdateVal = document.getElementById('birthdate').value;
      if (!birthdateVal) return;

      // 年齢計算 (18歳以上判定)
      const birthDate = new Date(birthdateVal);
      const today = new Date();
      let age = today.getFullYear() - birthDate.getFullYear();
      const m = today.getMonth() - birthDate.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
      }

      if (age < 18) {
        const errorEl = document.getElementById('errorMessage');
        errorEl.textContent = '本サービスは18歳未満の方はご利用いただけません。';
        errorEl.style.display = 'block';
        window.scrollTo(0, 0);
        return;
      }

      // Supabase等への登録処理をここに記述
      alert('登録処理へ進みます');
    });
  </script>

</body>
</html>
