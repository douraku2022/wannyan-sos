<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>管理コンソール｜ワンニャンSOS熊本</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 54px 0 40px 0;
      background-color: #dbe2e8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* 📌 最上部：共通固定ヘッダー */
    .app-top-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 46px;
      background: #c53030; color: #ffffff; border-bottom: 2px solid #9b2c2c;
      display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
      z-index: 1000; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .top-btn {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      color: #ffffff; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold;
      text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 4px;
    }
    .top-btn:active { background: rgba(255,255,255,0.3); }
    .top-title { font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }

    /* 🍔 右側スライドナビゲーション */
    .menu-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 1001;
    }
    .side-drawer {
      position: fixed; top: 0; right: -260px; width: 240px; height: 100%;
      background: linear-gradient(180deg, #ecefe6 0%, #d8ded6 100%);
      border-left: 3px solid #9aa5b0; z-index: 1002;
      box-shadow: -4px 0 16px rgba(0,0,0,0.2); transition: right 0.25s ease-in-out;
      display: flex; flex-direction: column; padding: 12px; gap: 10px;
    }
    .side-drawer.open { right: 0; }
    .drawer-header {
      background: #00873c; color: #fff; border-radius: 8px; padding: 10px;
      text-align: center; font-size: 13px; font-weight: bold; border: 1px solid #005a28;
      display: flex; justify-content: space-between; align-items: center;
    }
    .drawer-close-btn {
      background: none; border: none; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer;
    }

    .drawer-menu-item {
      background: #f8fafc; border: 2px solid #a0aec0; border-radius: 10px; padding: 12px;
      color: #2d3748; text-decoration: none; font-size: 13px; font-weight: bold;
      display: flex; align-items: center; gap: 8px; box-shadow: 0 2px 0 #cbd5e0;
    }
    .drawer-menu-item:active { transform: translateY(1px); box-shadow: 0 1px 0 #cbd5e0; }

    .admin-container { max-width: 480px; margin: 0 auto; padding: 0 12px; }

    .admin-badge {
      background: #fff5f5; border: 2px dashed #feb2b2; border-radius: 10px; padding: 10px 12px;
      font-size: 11px; color: #9b2c2c; margin-bottom: 16px; text-align: center; font-weight: bold;
    }

    .menu-btn-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .admin-menu-card {
      background: #ffffff; border: 2px solid #cbd5e0; border-radius: 12px; padding: 16px;
      text-decoration: none; color: #2d3748; font-weight: bold; font-size: 14px;
      display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .admin-menu-card:active { transform: translateY(1px); }
    .loading-box {
      background: #fff; border: 1px solid #cbd5e0; border-radius: 8px; padding: 24px; text-align: center; color: #718096; font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <!-- 📌 最上部：共通固定ヘッダー -->
  <div class="app-top-bar">
    <button type="button" class="top-btn" onclick="window.location.href='home.html'">← 一般ホームへ</button>
    <div class="top-title">🛠 ワンニャンSOS | 管理コンソール</div>
    <button type="button" class="top-btn" onclick="toggleMenu()">☰ メニュー</button>
  </div>

  <!-- 🍔 右スライドメニュー -->
  <div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()"></div>
  <div id="sideDrawer" class="side-drawer">
    <div class="drawer-header">
      <span>🐾 ワンニャンSOS メニュー</span>
      <button class="drawer-close-btn" onclick="toggleMenu()">✕</button>
    </div>
    <a href="home.html" class="drawer-menu-item">🏠 一般ホーム</a>
    <a href="sos.html" class="drawer-menu-item">📦 状況・支援一覧</a>
    <a href="mypage.html" class="drawer-menu-item">👤 マイページ</a>
    <a href="admin.html" class="drawer-menu-item" style="color: #c53030;">🛠 管理コンソール</a>
    <button onclick="logout()" class="drawer-menu-item" style="background:#fff5f5; color:#c53030; border-color:#feb2b2; width:100%; cursor:pointer;">🚪 ログアウト</button>
  </div>

  <div class="admin-container">

    <div id="loadingBox" class="loading-box">権限を確認しています...</div>

    <div id="adminContent" style="display:none;">
      <div class="admin-badge">🛠 管理者としてログイン中</div>

      <div class="menu-btn-group">
        <a href="info-manage.html" class="admin-menu-card" style="border-color: #3182ce; background: #ebf8ff;">
          <span>📢 お知らせ・運営情報の編集・投稿</span>
          <span>➔</span>
        </a>

        <a href="sos.html" class="admin-menu-card">
          <span>📦 状況・支援投稿一覧（全件チェック）</span>
          <span>➔</span>
        </a>

        <a href="admin-users.html" class="admin-menu-card" style="border-color: #d69e2e; background: #fffaf0;">
          <span>👥 管理者の追加・解除</span>
          <span>➔</span>
        </a>
      </div>

      <button type="button" onclick="logout()" style="width: 100%; padding: 12px; background: #718096; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
        🔒 ログアウト
      </button>
    </div>

  </div>

  <script>
    // 🔐 家の中共通の未ログインガード
    const savedPhone = localStorage.getItem('wanSOS_user_phone');
    if (!savedPhone) {
      window.location.href = '../index.html';
    }

    function toggleMenu() {
      const drawer = document.getElementById('sideDrawer');
      const overlay = document.getElementById('menuOverlay');
      const isOpen = drawer.classList.contains('open');
      if (isOpen) {
        drawer.classList.remove('open');
        overlay.style.display = 'none';
      } else {
        drawer.classList.add('open');
        overlay.style.display = 'block';
      }
    }

    function logout() {
      if (confirm("ログアウトしますか？")) {
        localStorage.removeItem('wanSOS_user_phone');
        localStorage.removeItem('wanSOS_profile');
        sessionStorage.removeItem('wannyanSOS_loggedIn');
        window.location.href = '../index.html';
      }
    }

    // 🛠 本物のログインセッション＋is_adminフラグで管理者かどうかを判定する
    document.addEventListener('DOMContentLoaded', async () => {
      if (!window.supabaseClient) {
        alert("データベース接続設定が見つかりません。");
        window.location.href = 'home.html';
        return;
      }

      try {
        const { data: { session } } = await window.supabaseClient.auth.getSession();
        if (!session || !session.user) {
          alert("ログイン情報が確認できませんでした。");
          window.location.href = '../index.html';
          return;
        }

        const { data, error } = await window.supabaseClient
          .from('users_profiles')
          .select('is_admin')
          .eq('auth_user_id', session.user.id)
          .single();

        if (error || !data || data.is_admin !== true) {
          alert("管理者権限がありません。");
          window.location.href = 'home.html';
          return;
        }

        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
      } catch (e) {
        alert("権限確認中にエラーが発生しました。");
        window.location.href = 'home.html';
      }
    });
  </script>

</body>
</html>
