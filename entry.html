<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ワンニャンSOS熊本｜物資支援プラットフォーム</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 54px 0 40px 0;
      background-color: #dbe2e8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* 📌 最上部：共通固定ヘッダー（メニューなし） */
    .app-top-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 46px;
      background: #00873c; color: #ffffff; border-bottom: 2px solid #005a28;
      display: flex; align-items: center; justify-content: center; padding: 0 10px;
      z-index: 1000; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .top-title { font-size: 13px; font-weight: bold; letter-spacing: 0.5px; }

    .entry-container { max-width: 480px; margin: 0 auto; padding: 0 12px; text-align: center; }

    .hero-card {
      background: linear-gradient(180deg, #ffffff 0%, #f7fafc 100%);
      border: 3px solid #00873c; border-radius: 16px; padding: 24px 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1); margin-bottom: 16px;
    }
    .hero-title { font-size: 20px; font-weight: bold; color: #00873c; margin: 8px 0; }
    .hero-sub { font-size: 12px; color: #4a5568; line-height: 1.6; margin-bottom: 20px; }

    .gate-btn {
      display: block; width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: bold;
      text-decoration: none; margin-bottom: 10px; box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: all 0.1s;
    }
    .gate-btn.primary { background: #00873c; color: #ffffff; border: 2px solid #005a28; }
    .gate-btn.secondary { background: #3182ce; color: #ffffff; border: 2px solid #2b6cb0; }
  </style>
</head>

<body>

  <!-- 📌 最上部：共通固定ヘッダー（メニュー削除版） -->
  <div class="app-top-bar">
    <div class="top-title">🐕🐈 ワンニャンSOS熊本</div>
  </div>

  <div class="entry-container" style="margin-top: 10px;">
    <div class="hero-card">
      <div style="font-size: 40px;">🐕 🐾 🐈</div>
      <div class="hero-title">ワンニャンSOS熊本</div>
      <div class="hero-sub">
        被災地・支援現場のワンちゃん・ネコちゃんへ<br>
        物資のSOSときっぷで繋がる相互支援掲示板
      </div>

      <a href="sos.html" class="gate-btn primary">
        🏠 SOS掲示板に入る（閲覧・支援） ➔
      </a>

      <a href="sos-create.html" class="gate-btn secondary">
        🎫 物資SOSきっぷを発券する ➔
      </a>
    </div>
  </div>

</body>
</html>
